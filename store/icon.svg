<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f8eeda"/>
      <stop offset="1" stop-color="#d8c199"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.43" r="0.66">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#fffdf6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a3a24" stop-opacity="0.14"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.44"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- warm mat to lift the jar off the background -->
  <rect x="150" y="150" width="724" height="724" rx="150" fill="#fbf4e4" fill-opacity="0.5"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- shelf -->
  <rect x="150" y="866" width="724" height="28" rx="14" fill="#c99c6a"/>
  <rect x="150" y="881" width="724" height="13" rx="6" fill="#9a7143"/>

  <!-- loose bead, waiting to be sorted -->
  <g>
    <circle cx="812" cy="812" r="58" fill="#7ba6c8"/>
    <path d="M 812 812 m -50 0 a 50 50 0 0 1 100 0" fill="none" stroke="#57809f" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" transform="rotate(30 812 812)"/>
    <ellipse cx="793" cy="793" rx="19" ry="14" fill="#ffffff" fill-opacity="0.66"/>
  </g>

  <!-- jar shadow -->
  <ellipse cx="512" cy="878" rx="246" ry="30" fill="#000000" fill-opacity="0.11"/>

  <!-- jar body -->
  <path d="M 288 198
           L 736 198
           Q 756 198 756 234
           L 756 768
           Q 756 862 660 862
           L 364 862
           Q 268 862 268 768
           L 268 234
           Q 268 198 288 198 Z"
        fill="url(#glass)" stroke="#a5855e" stroke-width="18"/>

  <!-- beads, bottom -> top: berry / honey / sage -->
  <g>
    <circle cx="512" cy="724" r="116" fill="#d7705f"/>
    <path d="M 512 724 m -106 0 a 106 106 0 0 1 212 0" fill="none" stroke="#ad5346" stroke-width="17" stroke-linecap="round" transform="rotate(26 512 724)"/>
    <ellipse cx="471" cy="681" rx="33" ry="23" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="461" cy="671" r="12" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <g>
    <circle cx="512" cy="496" r="116" fill="#e6ad4d"/>
    <path d="M 512 496 m -106 0 a 106 106 0 0 1 212 0" fill="none" stroke="#c08a31" stroke-width="17" stroke-linecap="round" transform="rotate(26 512 496)"/>
    <ellipse cx="471" cy="453" rx="33" ry="23" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="461" cy="443" r="12" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  <g>
    <circle cx="512" cy="302" r="103" fill="#83a86f"/>
    <path d="M 512 302 m -94 0 a 94 94 0 0 1 188 0" fill="none" stroke="#647f52" stroke-width="16" stroke-linecap="round" transform="rotate(26 512 302)"/>
    <ellipse cx="477" cy="264" rx="29" ry="20" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="468" cy="255" r="11" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- glass sheen + rim light -->
  <rect x="334" y="222" width="30" height="552" rx="15" fill="#ffffff" fill-opacity="0.34"/>
  <rect x="688" y="252" width="14" height="462" rx="7" fill="#ffffff" fill-opacity="0.17"/>
  <path d="M 302 242 Q 512 192 722 242" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="13" stroke-linecap="round"/>

  <rect width="1024" height="1024" fill="url(#vig)"/>
</svg>
